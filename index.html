<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#2f80d4" />
  <title>LumoLingo — Play, Speak, Listen, and Grow</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell"></div>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal__shade" data-close-modal></div>
    <section class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal__head">
        <h2 id="modalTitle">LumoLingo</h2>
        <button class="icon-btn" type="button" data-close-modal aria-label="Close modal">×</button>
      </header>
      <div id="modalBody" class="modal__body"></div>
      <footer id="modalFooter" class="modal__foot"></footer>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
